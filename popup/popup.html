<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Story Reader</title>
  <style>
    body {
      width: 240px;
      padding: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #060a12;
      color: #e8f0ff;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 8px;
      background: #00e5ff;
      color: #060a12;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.12s, box-shadow 0.12s;
    }
    button:hover {
      background: #67f0ff;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.4);
    }
    button.secondary {
      background: transparent;
      color: #e8f0ff;
      border-color: rgba(0, 229, 255, 0.2);
      font-weight: 500;
    }
    button.secondary:hover {
      background: rgba(0, 229, 255, 0.1);
      color: #00e5ff;
      box-shadow: none;
    }
    .status {
      font-size: 12px;
      color: #7a8ba0;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h3>Story Reader</h3>
  <button id="btn-start">Bắt đầu đọc</button>
  <button id="btn-hide" class="secondary">Ẩn thanh công cụ</button>
  <div class="status" id="status">Bấm "Bắt đầu đọc" để hiện thanh điều khiển trên trang.</div>

  <script src="popup.js"></script>
</body>
</html>
